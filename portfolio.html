<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dr Hédi Belhoula — Médecin &amp; Développeur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFF1EA;
    --paper-raised:#F8F9F4;
    --ink:#17262C;
    --ink-soft:#51625F;
    --teal:#2E6259;
    --teal-dark:#1D453E;
    --navy:#1B2E3C;
    --navy-soft:#28405270;
    --red:#A93226;
    --line:#D6DACF;
    --line-dark:#3B4E5C;
    --radius:2px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}

  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:17px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }

  body.lang-ar{
    font-family:'IBM Plex Sans Arabic', sans-serif;
  }
  body.lang-ar h1, body.lang-ar h2, body.lang-ar h3, body.lang-ar .stat-value{
    font-family:'IBM Plex Sans Arabic', sans-serif;
    font-weight:700;
  }
  body.lang-ar .tracking{ letter-spacing:0; }

  h1,h2,h3{
    font-family:'IBM Plex Serif', serif;
    font-weight:600;
    margin:0;
    color:var(--ink);
  }

  p{margin:0;}

  .wrap{
    max-width:1080px;
    margin-inline:auto;
    padding-inline:28px;
  }

  a{color:inherit;}

  /* ---------- NAV ---------- */
  .topbar{
    position:sticky; top:0; z-index:50;
    background:var(--navy);
    border-bottom:1px solid var(--line-dark);
  }
  .topbar .wrap{
    display:flex; align-items:center; justify-content:space-between;
    padding-block:14px;
  }
  .mark{
    color:var(--paper);
    font-family:'IBM Plex Serif', serif;
    font-weight:600;
    font-size:19px;
  }
  body.lang-ar .mark{ font-family:'IBM Plex Sans Arabic', sans-serif; }
  .mark span{ color:#8FAFA3; }

  .langswitch{
    display:flex; gap:4px;
    border:1px solid var(--line-dark);
    padding:3px;
  }
  .langswitch button{
    appearance:none; border:none; background:transparent;
    color:#B9C3C7;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:13px;
    padding:6px 12px;
    cursor:pointer;
    border-radius:1px;
  }
  .langswitch button.active{
    background:var(--paper);
    color:var(--navy);
    font-weight:600;
  }

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    background:var(--navy);
    color:var(--paper);
    overflow:hidden;
    background-image:repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.035) 0px,
      rgba(255,255,255,0.035) 1px,
      transparent 1px,
      transparent 30px
    );
  }
  .hero .wrap{
    padding-top:76px;
    padding-bottom:56px;
    position:relative;
  }
  .ecg-wrap{
    width:100%;
    max-width:640px;
    margin-bottom:18px;
    opacity:0.9;
  }
  .ecg-wrap svg{ width:100%; height:auto; display:block; }
  .ecg-path{
    fill:none;
    stroke:var(--red);
    stroke-width:2.5;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  @media (prefers-reduced-motion: no-preference){
    .ecg-path{
      stroke-dasharray:900;
      stroke-dashoffset:900;
      animation:draw 2.1s cubic-bezier(.3,.7,.2,1) 0.15s forwards;
    }
  }
  @keyframes draw{ to{ stroke-dashoffset:0; } }

  .hero h1{
    color:var(--paper);
    font-size:clamp(30px, 4.4vw, 48px);
    line-height:1.18;
    max-width:15ch;
  }
  .hero .subhead{
    margin-top:18px;
    max-width:52ch;
    color:#C7D0CC;
    font-size:18px;
  }
  .hero .signoff{
    margin-top:10px;
    color:#8FAFA3;
    font-size:15px;
  }

  .stats{
    margin-top:44px;
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:1px;
    background:var(--line-dark);
    border:1px solid var(--line-dark);
  }
  .stat{
    background:#20344450;
    padding:18px 16px;
  }
  .stat-value{
    font-family:'IBM Plex Serif', serif;
    font-size:28px;
    color:var(--paper);
    font-weight:600;
  }
  .stat-label{
    margin-top:6px;
    font-size:12.5px;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:#9AACA6;
  }
  body.lang-ar .stat-label{ text-transform:none; letter-spacing:0; }

  @media (max-width:720px){
    .stats{ grid-template-columns:repeat(2, 1fr); }
  }

  /* ---------- SECTION GENERIC ---------- */
  section{ padding-block:76px; }
  .section-head{
    max-width:60ch;
    margin-bottom:40px;
  }
  .section-head h2{
    font-size:clamp(24px, 3vw, 32px);
  }
  .section-head p{
    margin-top:14px;
    color:var(--ink-soft);
    font-size:17px;
  }

  .about{ border-bottom:1px solid var(--line); }
  .about .grid{
    display:grid;
    grid-template-columns:1fr 1.6fr;
    gap:48px;
    align-items:start;
  }
  .about .tag{
    display:inline-block;
    border:1px solid var(--teal);
    color:var(--teal-dark);
    font-size:13px;
    padding:5px 11px;
    margin-bottom:14px;
  }
  .about .name{
    font-size:22px;
    margin-bottom:2px;
  }
  .about .role{
    color:var(--ink-soft);
    font-size:15px;
    margin-bottom:20px;
  }
  .about-bio p{
    font-size:18px;
    color:var(--ink);
    max-width:62ch;
  }
  @media (max-width:800px){
    .about .grid{ grid-template-columns:1fr; }
  }

  /* ---------- PRINCIPLES ---------- */
  .principles{
    background:var(--paper-raised);
    border-bottom:1px solid var(--line);
  }
  .principle-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:0;
    border-top:1px solid var(--line);
    border-inline-start:1px solid var(--line);
  }
  .principle{
    padding:24px 22px;
    border-inline-end:1px solid var(--line);
    border-bottom:1px solid var(--line);
  }
  .principle h3{
    font-size:17px;
    margin-bottom:8px;
  }
  .principle p{
    color:var(--ink-soft);
    font-size:14.5px;
  }
  @media (max-width:860px){
    .principle-grid{ grid-template-columns:repeat(2,1fr); }
  }
  @media (max-width:520px){
    .principle-grid{ grid-template-columns:1fr; }
  }

  /* ---------- PROJECTS ---------- */
  .projects-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
  }
  @media (max-width:760px){
    .projects-grid{ grid-template-columns:1fr; }
  }
  .card{
    background:var(--paper);
    padding:26px 26px 24px;
    display:flex;
    flex-direction:column;
  }
  .card-top{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:14px;
  }
  .badge{
    width:38px; height:38px;
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    color:#fff;
    font-size:13px;
    font-weight:600;
    border-radius:50%;
  }
  .card-titles{ min-width:0; }
  .card h3{
    font-size:18px;
    line-height:1.3;
  }
  .card .cat{
    margin-top:2px;
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .card p.desc{
    color:var(--ink-soft);
    font-size:15px;
    margin-bottom:16px;
    flex-grow:1;
  }
  .chips{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .chip{
    font-size:12.5px;
    border:1px solid var(--line);
    color:var(--ink-soft);
    padding:4px 10px;
  }

  /* ---------- FOOTER ---------- */
  footer{
    background:var(--navy);
    color:var(--paper);
  }
  footer .wrap{
    padding-block:64px;
  }
  footer h2{
    color:var(--paper);
    font-size:clamp(22px,3vw,30px);
    max-width:20ch;
  }
  footer .fp{
    margin-top:14px;
    color:#C7D0CC;
    max-width:50ch;
    font-size:16px;
  }
  .cta-btn{
    display:inline-block;
    margin-top:26px;
    background:var(--red);
    color:#fff;
    text-decoration:none;
    padding:12px 22px;
    font-size:15px;
    font-weight:600;
    border-radius:1px;
  }
  .foot-bottom{
    margin-top:48px;
    padding-top:20px;
    border-top:1px solid var(--line-dark);
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
    font-size:13px;
    color:#8393A0;
  }

  [dir="rtl"] .stat-label{ direction:rtl; }
</style>
</head>

function setText(el, val){ el.innerHTML = val; }

function render(lang){
  const c = content[lang];
  document.documentElement.setAttribute('lang', lang);
  document.documentElement.setAttribute('dir', c.dir);
  document.body.classList.toggle('lang-ar', lang === 'ar');

  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const path = el.getAttribute('data-i18n').split('.');
    let val = c;
    for(const p of path){
      if(val == null) break;
      val = val[p];
    }
    if(val !== undefined) setText(el, val);
  });

  document.querySelectorAll('.langswitch button').forEach(b=>{
    b.classList.toggle('active', b.getAttribute('data-lang') === lang);
  });

  // principles
  const pg = document.getElementById('principle-grid');
  pg.innerHTML = '';
  c.principles.items.forEach(p=>{
    const div = document.createElement('div');
    div.className = 'principle';
    div.innerHTML = `<h3>${p.t}</h3><p>${p.d}</p>`;
    pg.appendChild(div);
  });

  // projects
  const grid = document.getElementById('projects-grid');
  grid.innerHTML = '';
  c.projects.items.forEach((p, i)=>{
    const card = document.createElement('div');
    card.className = 'card';
    const chips = p.f.map(x=>`<span class="chip">${x}</span>`).join('');
    card.innerHTML = `
      <div class="card-top">
        <div class="badge" style="background:${colors[i % colors.length]}">${p.m}</div>
        <div class="card-titles">
          <h3>${p.t}</h3>
          <div class="cat">${p.c}</div>
        </div>
      </div>
      <p class="desc">${p.d}</p>
      <div class="chips">${chips}</div>
    `;
    grid.appendChild(card);
  });
}

document.querySelectorAll('.langswitch button').forEach(btn=>{
  btn.addEventListener('click', ()=> render(btn.getAttribute('data-lang')));
});

render('fr');
</script>
