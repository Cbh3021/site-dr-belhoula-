  .hero{

    content:""; position:absolute; inset:0; opacity:.5; pointer-events:none;

  }
  .hero::after{
    content:""; position:absolute; width:520px; height:520px; border-radius:50%;
    background:radial-gradient(circle, rgba(221,90,60,0.35), transparent 70%);
    top:-220px; right:-160px; filter:blur(10px); pointer-events:none;
  }
  html[dir="rtl"] .hero::after{ right:auto; left:-160px; }
  .hero .wrap{ position:relative; padding-block:74px 54px; }
  .hero-eyebrow{ color:#E7B49E; }
  .hero-eyebrow::before{ background:#E7B49E; }
  .ecg-wrap{ width:100%; max-width:600px; margin-bottom:22px; opacity:.95; }
  .ecg-wrap svg{ width:100%; height:auto; display:block; }
  .ecg-path{ fill:none; stroke:var(--coral); stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
  @media (prefers-reduced-motion:no-preference){
    .ecg-path{ stroke-dasharray:900; stroke-dashoffset:900; animation:draw 2s var(--ease) .1s forwards; }
  }
  @keyframes draw{ to{ stroke-dashoffset:0; } }
  .hero h1{
    color:#fff; font-size:clamp(32px,5vw,54px); line-height:1.1; max-width:16ch; font-weight:600;
  }
  .hero .subhead{ margin-top:20px; max-width:56ch; color:#C9D8D3; font-size:18px; }
  .hero-actions{ display:flex; gap:12px; flex-wrap:wrap; margin-top:30px; }

  .stats{
    margin-top:50px; display:grid; grid-template-columns:repeat(4,1fr); gap:1px;
    background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.12); border-radius:var(--radius);
    overflow:hidden;
  }
  .stat{ background:rgba(255,255,255,0.04); padding:20px 18px; }
  .stat-value{ font-family:var(--font-display); font-size:30px; color:#fff; font-weight:600; }
  .stat-label{ margin-top:6px; font-size:12.5px; text-transform:uppercase; letter-spacing:.05em; color:#9FB4AD; }
  html[lang="ar"] .stat-label{ text-transform:none; }
  @media (max-width:720px){ .stats{ grid-template-columns:repeat(2,1fr); } }

  section{ padding-block:80px; }
  .section-head{ max-width:64ch; margin-bottom:42px; }
  .section-head h2{ font-size:clamp(25px,3vw,34px); }
  .section-head p{ margin-top:14px; color:var(--ink-soft); font-size:17px; }

  .about{ border-top:1px solid var(--border); border-bottom:1px solid var(--border); background:var(--surface); }
  .about .grid{ display:grid; grid-template-columns:0.85fr 1.5fr; gap:56px; align-items:start; }
  .about .tag{ display:inline-block; border:1px solid var(--teal); color:var(--teal-deep); background:var(--teal-tint); font-size:13px; padding:6px 12px; border-radius:999px; margin-bottom:16px; }
  .about .name{ font-size:23px; margin-bottom:4px; }
  .about .role{ color:var(--ink-soft); font-size:15px; margin-bottom:22px; }
  .about-bio p{ font-size:19px; color:var(--ink); max-width:62ch; }

  .principles{ background:var(--paper-2); }
  .principle-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  .principle{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:24px 22px; transition:transform .18s var(--ease), box-shadow .18s var(--ease); }
  .principle:hover{ transform:translateY(-3px); box-shadow:var(--shadow); }
  .principle h3{ font-family:var(--font-body); font-weight:600; font-size:16.5px; margin-bottom:9px; }
  html[lang="ar"] .principle h3{ font-family:var(--font-body-ar); }
  .principle p{ color:var(--ink-soft); font-size:14.5px; }

  @media (max-width:520px){ .principle-grid{ grid-template-columns:1fr; } }

  .card{

  .card:hover{ transform:translateY(-4px); box-shadow:var(--shadow); border-color:var(--border-strong); }
  .card-top{ display:flex; align-items:center; gap:14px; margin-bottom:16px; }
  .badge{ width:42px; height:42px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; color:#fff; font-family:var(--font-mono); font-size:13px; font-weight:600; border-radius:12px; }

  .card .cat{ margin-top:3px; font-size:12.5px; font-family:var(--font-mono); color:var(--coral-deep); }
  .card p.desc{ color:var(--ink-soft); font-size:15px; margin-bottom:18px; flex-grow:1; }

  .chip{ font-size:12.5px; border:1px solid var(--border); border-radius:999px; color:var(--ink-soft); padding:5px 12px; }

  .cta-footer{
    background:radial-gradient(900px 420px at 90% -20%, #163F3B 0%, var(--teal-deep) 55%, #081F1D 100%);
    color:#fff;

  .cta-footer .wrap{ padding-block:70px; }

  .cta-row{ display:flex; gap:12px; flex-wrap:wrap; margin-top:28px; }
  .foot-bottom{
    margin-top:52px; padding-top:22px; border-top:1px solid rgba(255,255,255,0.14);
    display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; font-size:13px; color:#9FB4AD;
  }
</style>

function renderLocal(lang){
  const c = content[lang] || content.fr;
  document.getElementById('js-brand-sub').textContent = c.brandSub;
  document.getElementById('js-hero-eyebrow').textContent = c.hero.eyebrow;
  document.getElementById('js-hero-title').textContent = c.hero.title;
  document.getElementById('js-hero-subhead').textContent = c.hero.subhead;
  document.getElementById('js-cta-apps').textContent = c.hero.ctaApps;
  document.getElementById('js-cta-articles').textContent = c.hero.ctaArticles;
  c.stats.forEach((s,i)=>{ document.getElementById('js-stat-'+i).textContent = s; });

  document.getElementById('js-about-tag').textContent = c.about.tag;
  document.getElementById('js-about-role').textContent = c.about.role;
  document.getElementById('js-about-bio').textContent = c.about.bio;

  document.getElementById('js-principles-title').textContent = c.principles.title;
  const pg = document.getElementById('principle-grid');
  pg.innerHTML = '';
  c.principles.items.forEach(p=>{
    const div = document.createElement('div');
    div.className = 'principle';
    div.innerHTML = `<h3>${p.t}</h3><p>${p.d}</p>`;
    pg.appendChild(div);
  });

  document.getElementById('js-projects-title').textContent = c.projects.title;
  document.getElementById('js-projects-intro').textContent = c.projects.intro;
  const grid = document.getElementById('projects-grid');
  grid.innerHTML = '';
  c.projects.items.forEach((p, i)=>{
    const card = document.createElement('div');
    card.className = 'card';
    const chips = p.f.map(x=>`<span class="chip">${x}</span>`).join('');
    card.innerHTML = `
      <div class="card-top">
        <div class="badge" style="background:${colors[i % colors.length]}">${p.m}</div>
        <div class="card-titles">
          <h3>${p.t}</h3>
          <div class="cat">${p.c}</div>
        </div>
      </div>
      <p class="desc">${p.d}</p>
      <div class="chips">${chips}</div>
    `;
    grid.appendChild(card);
  });

  document.getElementById('js-footer-title').textContent = c.footer.title;
  document.getElementById('js-footer-text').textContent = c.footer.text;
  document.getElementById('js-footer-cta').textContent = c.footer.cta;
  document.getElementById('js-footer-cabinet').textContent = c.footer.cabinet;
}

document.addEventListener('langchange', function(e){ renderLocal(e.detail.lang); });
i18n.initLangSwitcher();
